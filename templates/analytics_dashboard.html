<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Analytics - Alcaldía Santa Fe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #4ECDC4;
            margin: 10px 0;
        }
        .metric-label {
            color: #fff;
            font-size: 1.1em;
            opacity: 0.9;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .time-filter {
            text-align: center;
            margin: 20px 0;
        }
        .time-filter button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .time-filter button.active {
            background: #4ECDC4;
        }
        .time-filter button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .realtime-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ECDC4;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-chart-line"></i> Dashboard de Analytics</h1>
            <p>Métricas de tráfico web en tiempo real</p>
        </header>

        <!-- Filtros de tiempo -->
        <div class="time-filter">
            <button class="active" onclick="changePeriod(1)">24 Horas</button>
            <button onclick="changePeriod(7)">7 Días</button>
            <button onclick="changePeriod(30)">30 Días</button>
            <button onclick="changePeriod(90)">90 Días</button>
        </div>

        <!-- Métricas principales -->
        <div class="analytics-grid">
            <div class="metric-card">
                <i class="fas fa-eye fa-2x" style="color: #4ECDC4;"></i>
                <div class="metric-value" id="total-views">-</div>
                <div class="metric-label">Vistas Totales</div>
            </div>
            <div class="metric-card">
                <i class="fas fa-users fa-2x" style="color: #FF6B6B;"></i>
                <div class="metric-value" id="unique-visitors">-</div>
                <div class="metric-label">Visitantes Únicos</div>
            </div>
            <div class="metric-card">
                <i class="fas fa-user-clock fa-2x" style="color: #45B7D1;"></i>
                <div class="metric-value" id="unique-sessions">-</div>
                <div class="metric-label">Sesiones Únicas</div>
            </div>
            <div class="metric-card">
                <i class="fas fa-tachometer-alt fa-2x" style="color: #96CEB4;"></i>
                <div class="metric-value" id="avg-load-time">-</div>
                <div class="metric-label">Tiempo Promedio (ms)</div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="chart-container">
            <h3><i class="fas fa-chart-area"></i> Tráfico por Hora (Últimas 24h)</h3>
            <div id="hourly-chart" style="height: 400px;"></div>
        </div>

        <div class="chart-container">
            <h3><i class="fas fa-chart-bar"></i> Páginas Más Visitadas</h3>
            <div id="pages-chart" style="height: 400px;"></div>
        </div>

        <!-- Estadísticas en tiempo real -->
        <div class="chart-container">
            <h3>
                <span class="realtime-indicator"></span>
                Estadísticas en Tiem Real
            </h3>
            <div id="realtime-stats">
                <p>Cargando estadísticas en tiempo real...</p>
            </div>
        </div>
    </div>

    <script>
        let currentPeriod = 1;
        let realtimeInterval;

        // Cargar datos iniciales
        document.addEventListener('DOMContentLoaded', function() {
            loadAnalytics(1);
            startRealtimeUpdates();
        });

        function changePeriod(days) {
            currentPeriod = days;
            
            // Actualizar botones activos
            document.querySelectorAll('.time-filter button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadAnalytics(days);
        }

        async function loadAnalytics(days) {
            try {
                const response = await fetch(`/api/analytics/stats?days=${days}`);
                const data = await response.json();
                
                if (data.success) {
                    updateMetrics(data.stats);
                    updateCharts(data.stats);
                }
            } catch (error) {
                console.error('Error cargando analytics:', error);
            }
        }

        function updateMetrics(stats) {
            document.getElementById('total-views').textContent = stats.total_views.toLocaleString();
            document.getElementById('unique-visitors').textContent = stats.unique_visitors.toLocaleString();
            document.getElementById('unique-sessions').textContent = stats.unique_sessions.toLocaleString();
            document.getElementById('avg-load-time').textContent = stats.avg_load_time;
        }

        function updateCharts(stats) {
            // Gráfico de páginas más visitadas
            const pagesData = [{
                x: stats.top_pages.map(p => p.views),
                y: stats.top_pages.map(p => p.url),
                type: 'bar',
                orientation: 'h',
                marker: {
                    color: '#4ECDC4'
                }
            }];

            const pagesLayout = {
                title: 'Páginas Más Visitadas',
                xaxis: { title: 'Vistas' },
                yaxis: { title: 'Página' },
                margin: { l: 200 }
            };

            Plotly.newPlot('pages-chart', pagesData, pagesLayout);
        }

        async function loadRealtimeStats() {
            try {
                const response = await fetch('/api/analytics/realtime');
                const data = await response.json();
                
                if (data.success) {
                    updateRealtimeStats(data.stats);
                }
            } catch (error) {
                console.error('Error cargando stats en tiempo real:', error);
            }
        }

        function updateRealtimeStats(stats) {
            const container = document.getElementById('realtime-stats');
            
            // Gráfico de tráfico por hora
            const hourlyData = [{
                x: stats.hourly_views.map(h => h.hour),
                y: stats.hourly_views.map(h => h.views),
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: '#FF6B6B', width: 3 },
                marker: { size: 8, color: '#FF6B6B' }
            }];

            const hourlyLayout = {
                title: 'Tráfico por Hora',
                xaxis: { title: 'Hora' },
                yaxis: { title: 'Vistas' }
            };

            Plotly.newPlot('hourly-chart', hourlyData, hourlyLayout);

            // Actualizar contador de vistas en 24h
            document.getElementById('total-views').textContent = stats.views_24h.toLocaleString();
            document.getElementById('unique-visitors').textContent = stats.visitors_24h.toLocaleString();
        }

        function startRealtimeUpdates() {
            // Cargar datos en tiempo real cada 30 segundos
            realtimeInterval = setInterval(loadRealtimeStats, 30000);
            
            // Cargar datos iniciales
            loadRealtimeStats();
        }

        // Limpiar intervalo al salir de la página
        window.addEventListener('beforeunload', function() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
            }
        });
    </script>
</body>
</html>
