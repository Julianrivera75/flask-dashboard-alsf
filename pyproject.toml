[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alsf-dashboard"
version = "1.0.0"
description = "Sistema de Gestión de Indicadores - Alcaldía Local Santa Fe"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alcaldía Local Santa Fe", email = "contacto@alsf.gov.co"}
]
maintainers = [
    {name = "Alcaldía Local Santa Fe", email = "contacto@alsf.gov.co"}
]
keywords = ["flask", "dashboard", "municipal", "indicators", "bogota"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Government",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
    "flask-sqlalchemy>=3.0.0",
    "flask-wtf>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.5.0",
    "plotly>=5.0.0",
    "pytz>=2021.1",
    "requests>=2.25.0",
    "werkzeug>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]
prod = [
    "gunicorn>=20.1.0",
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/alsf/dashboard"
Documentation = "https://github.com/alsf/dashboard#readme"
Repository = "https://github.com/alsf/dashboard.git"
"Bug Tracker" = "https://github.com/alsf/dashboard/issues"

[project.scripts]
alsf-dashboard = "app_modular:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "services*", "routes*", "forms*", "middleware*", "utils*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
